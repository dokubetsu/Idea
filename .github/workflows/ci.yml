name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/api/requirements.txt
        pip install -r apps/api/requirements-dev.txt

    - name: Run code formatting check (black)
      run: black --check apps/api/app apps/api/tests

    - name: Run lint checks (ruff)
      run: ruff check apps/api/app apps/api/tests

    - name: Run static type checking (mypy)
      run: mypy --ignore-missing-imports apps/api/app

    - name: Run security SAST scanning (bandit)
      run: bandit -r apps/api/app -ll -x apps/api/app/domains/practice/rules_engine.py

    - name: Run dependency security audit (pip-audit)
      run: pip-audit

    - name: Set up Node.js (for Supabase CLI / tsx)
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Setup local Supabase + apply migrations and seeds
      run: |
        # Start stack, then explicitly reset so migrations 001–060 and seeds load
        npx supabase start
        npx supabase db reset --yes
        STATUS_JSON=$(npx supabase status -o json)
        API_URL=$(echo "$STATUS_JSON" | jq -r 'if .API_URL then .API_URL elif .api | type == "object" then .api.url else .api end')
        SERVICE_KEY=$(echo "$STATUS_JSON" | jq -r 'if .SERVICE_ROLE_KEY then .SERVICE_ROLE_KEY elif .api | type == "object" then .api.service_role_key else .service_role_key end')
        ANON_KEY=$(echo "$STATUS_JSON" | jq -r 'if .ANON_KEY then .ANON_KEY elif .api | type == "object" then .api.anon_key else .anon_key end')
        JWT_SECRET=$(echo "$STATUS_JSON" | jq -r 'if .JWT_SECRET then .JWT_SECRET elif .jwt_secret then .jwt_secret else empty end')
        if [ -z "$JWT_SECRET" ] || [ "$JWT_SECRET" = "null" ]; then
          # Supabase local default JWT secret (used when status omits the field)
          JWT_SECRET="super-secret-jwt-token-with-at-least-32-characters-long"
        fi
        echo "SUPABASE_TEST_PROJECT_URL=$API_URL" >> $GITHUB_ENV
        echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
        echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
        echo "SUPABASE_URL=$API_URL" >> $GITHUB_ENV
        echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
        echo "SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
        echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
        echo "API_URL=$API_URL"

    - name: Run RLS verification script
      run: npx tsx scripts/verify-rls.ts
      env:
        SUPABASE_URL: ${{ env.SUPABASE_TEST_PROJECT_URL }}
        SUPABASE_ANON_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}

    - name: Run pytest tests (Unit & Integration)
      run: |
        export PYTHONPATH=apps/api
        # Unit tests first (fast), then full suite including integration markers
        pytest apps/api/tests/unit -q
        pytest apps/api -q --tb=short
      env:
        CRON_SECRET: ci-test-secret
        PAYMENT_WEBHOOK_SECRET: ci-test-webhook-secret
        SUPABASE_URL: ${{ env.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        SUPABASE_JWT_SECRET: ${{ env.SUPABASE_JWT_SECRET }}
        SUPABASE_TEST_PROJECT_URL: ${{ env.SUPABASE_TEST_PROJECT_URL }}
        SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ env.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        SUPABASE_TEST_ANON_KEY: ${{ env.SUPABASE_TEST_ANON_KEY }}
        APP_ENV: development
        START_OUTBOX_WORKER: "false"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: apps/web/package-lock.json

    - name: Install npm dependencies
      run: npm --prefix apps/web ci

    - name: Run security audit (npm audit)
      run: npm --prefix apps/web audit --audit-level=high

    - name: Run type checking
      run: npm --prefix apps/web run type-check

    - name: Run linting
      run: npm --prefix apps/web run lint

    - name: Run unit tests (Vitest)
      run: npm --prefix apps/web run test:unit

    - name: Build web application
      run: npm --prefix apps/web run build
      env:
        # Must be https non-localhost (apps/web client fails closed in production builds)
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.placeholder.lead.local' }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Trigger Render Deploy Hook
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -n "$RENDER_DEPLOY_HOOK" ]; then
          echo "Triggering Render deployment..."
          curl -f -X GET "$RENDER_DEPLOY_HOOK"
        else
          echo "RENDER_DEPLOY_HOOK secret is not set. Skipping CD trigger."
        fi

