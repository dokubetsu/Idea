# Local stack for API + web + Redis + outbox worker.
# Supabase remains external (use `supabase start` / CLI for Postgres + Auth).
#
#   docker compose up --build
#
# Ensure apps/api/.env has SUPABASE_* pointing at local Supabase (usually http://host.docker.internal:54321).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    restart: unless-stopped
    ports: ["8000:8000"]
    env_file: ./apps/api/.env
    environment:
      # Outbox runs in the dedicated worker service below
      START_OUTBOX_WORKER: "false"
      REDIS_URL: redis://redis:6379/0
    volumes: ["./apps/api:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/livez')"]
      interval: 10s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./apps/api
    restart: unless-stopped
    env_file: ./apps/api/.env
    environment:
      START_OUTBOX_WORKER: "false"
      REDIS_URL: redis://redis:6379/0
    volumes: ["./apps/api:/app"]
    command: python run_worker.py
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./apps/web
    restart: unless-stopped
    working_dir: /app
    ports: ["3000:3000"]
    env_file: ./apps/web/.env.local
    volumes: ["./apps/web:/app", "/app/node_modules"]
    command: sh -c "npm ci && npm run dev"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
